mod=(x,y)=>{ return (x+y-(x/y)*y)%y }
U=(v,b,n)=>{
    let on = n
    let res = []
    let udigits = v.map((x)=>{return mod(x,b)})
    let resrem = []
    while (true) {
        let io = udigits.indexOf(mod(n,b))
        res.push(v[io])
        if (resrem.includes(n)) {
			a = resrem.indexOf(n)
            if (!(a == res.length-2 && res[a] == 0)) {
                isplentiful = false
				notplentifuldo(`${on} is unwritable`)
            } else {
				for (let re of res) {
					knownwritable[re.toString()] = 1
				}
			} 
            return
        } else {
            resrem.push(n)
        }
        n -= v[io]
        n /= b
		if (knownwritable[n.toString()] != undefined) {
			return 
		} 
    }
}
function notplentifuldo(rr) {

function _() {
    isplentiful = true
    z = e.value.split(";")
    inpb = BigInt(z[0])
    inp = z[1].split(" ").map((u)=>{
		for (let slang_ of slang) {
			if (u.toLocaleUpperCase() == slang_[0]) return slang_[1]
		}
		return BigInt(u)
	})
	knownwritable = {} 
    am = 0n
    inp.map((x)=>{
        y = x<0?-x:x
        if (y/9n > am) am = y/9n
    })
    am++

	if (!(inp.includes(0n))) {
		let message = [
			"if we get rid of 0, then we have to",
			"put different digits in all those places",
			"and we end up with an infinite sum.",
			"we can't write any finite values.",
			"EVERY NUMBER IS UNDEFINED!",
			"-TGC"
		]
		notplentifuldo(message.join("\n")); return
	}
	if (inp.length != Number(inpb)) {
		notplentifuldo(`number of digits must be equal to base`); return
	}
	let zi = false
	for (let v_ of inp) {
		if (mod(v_,inpb-1n) == 0 && v_ != 0) zi = true
	}
	if (zi) {
		notplentifuldo(`any digit cannot be a multiple of base - 1 (which is ${inpb-1n}) excluding 0\nthanks zi`); return
    }
	if (
		inp.map((u)=>mod(u,inpb)).toSorted((A,B)=>Number(A-B)).join(" ") !=
		new Array(Number(inpb)).fill(0).map((u,iu)=>iu).join(" ")
	) {
        notplentifuldo("one or more lumns empty\nlumns: " + inp.map((u)=>mod(u,inpb)).join(" ")); return
    }
	
    if (am > 10000000n) {
        e.setAttribute("style",ex("#0ff")); ec = 1000
		e2.setAttribute("style",ex2("#0ff"))
		e2.textContent = `your set is too cool to be checked\n(some digits are too big, im not checking ${(-am).toLocaleString()} to ${am.toLocaleString()})`
        w = new Audio(atob(aud.replace("-","M")))
        w.preservesPitch = false; w.playbackRate = 2
        w.play()
		return
    }
    logs = []
    for (let i = -am; i <= am && isplentiful; i++) {
		U(inp,inpb,i)
    }
    if (isplentiful) {
        e.setAttribute("style",ex("#0f0")); ec = 1000
        e2.setAttribute("style",ex2("#0f0"))

        w.preservesPitch = false; w.playbackRate = 2
        w.play()
        e2.textContent = pm[Math.floor(pm.length*Math.random())]
    }
}

})
